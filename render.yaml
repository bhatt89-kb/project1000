services:
  - type: web
    name: legal-document-assistant
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: FLASK_ENV
        value: production
      - key: MAX_DOCUMENTS
        value: 50
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: app-data
      mountPath: /tmp
      sizeGB: 1

