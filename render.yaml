services:
  - type: web
    name: legal-document-assistant
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 4 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MAX_DOCUMENTS
        value: 50
    healthCheckPath: /
